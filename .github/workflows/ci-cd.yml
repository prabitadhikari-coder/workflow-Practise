name: CI/CD Pipeline

# 1. What events trigger the pipeline?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 2. What jobs should run?
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step A: Download the code from the repo onto the GitHub runner machine
    - name: Checkout code
      uses: actions/checkout@v4

    # Step B: Install the language runtime (Python project)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    # Step C: Install the project packages
    - name: Install dependencies
      run: python -m pip install --upgrade pip

    # Step D: Run code tests/linters
    - name: Run tests
      run: python -m unittest discover -v

  deploy:
    # Only deploy if the build-and-test job finishes successfully
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy application
      run: echo "Deploying your application to the server..."
